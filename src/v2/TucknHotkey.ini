; Shared v1/v2 defaults. Generation preserves existing user INIs.
; IME appearance fallbacks in generated AHK are derived from this file too.
[Tools]
; Example: ClipboardToolCommand="C:\path\to\Clibor\Clibor.exe" /vc
ClipboardToolCommand=

[ImeIndicator]
; Show a red dot (inspired by the Japanese flag) while IME is ON. Reload after editing.
enabled=1
color=#E04040
; ellipse or rectangle; equal ellipse dimensions make a circle. Dimensions: 2-32px.
shape=ellipse
width_px=6
height_px=6
; Marker top-left relative to caret bottom-left, in screen pixels (-64 to 64).
offset_x_px=3
offset_y_px=-3

[Mouse]
accelerated_scroll_enabled=1
disabled_apps=Photoshop.exe,i_view64.exe
accelerated_scroll_timeout_ms=500
accelerated_scroll_fast_interval_ms=80
accelerated_scroll_start_distance=2
accelerated_scroll_curve=250
accelerated_scroll_boost=30
accelerated_scroll_limit=80
