[Tools]
; Example: ClipboardToolCommand="C:\path\to\Clibor\Clibor.exe" /vc
ClipboardToolCommand=

[ImeIndicator]
; Show a short underline at the lower right of the caret while IME is ON. Reload after editing.
enabled=1
color=#E07000
; Line width in pixels (3-24); thickness is fixed at 2px.
size_px=10

[Mouse]
accelerated_scroll_enabled=1
disabled_apps=Photoshop.exe,i_view64.exe
accelerated_scroll_timeout_ms=500
accelerated_scroll_fast_interval_ms=80
accelerated_scroll_start_distance=2
accelerated_scroll_curve=250
accelerated_scroll_boost=30
accelerated_scroll_limit=80
